
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buat Kalian 💌</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: 'Montserrat', sans-serif;
  background:
    linear-gradient(
      rgba(0, 0, 0, 0.35),
      rgba(0, 0, 0, 0.35)
    ),
    url("dvone.jpeg");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
  color: #111;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 800px;
  margin: 30px auto;
}

.card {
  width: 100%;
  max-width: 500px;
  margin: 0 auto;
  background: rgb(0, 102, 255);
  padding: 25px;
  border-radius: 20px;
  text-align: center;
  box-shadow: 0 5px 20px #00000020;
}

h2 {
  color: #000000;
  font-weight: 800;
}

h3 {
  font-weight: 700;
}

p {
  line-height: 1.7;
}

button, input, textarea {
  font: inherit;
}

button {
  border: none;
  border-radius: 10px;
  padding: 12px;
  cursor: pointer;
  font-weight: 700;
  transition: 0.2s;
}

button:hover {
  opacity: 0.85;
}

.option {
  display: block;
  width: 100%;
  margin-top: 10px;
  background: #ffe1eb;
  color: #444;
}

.option:hover {
  background: #ffc4d7;
}

.next {
  width: 100%;
  margin-top: 10px;
  background: #fae901;
  color: white;
}

input, textarea {
  width: 100%;
  margin: 10px 0;
  padding: 12px;
  border: 1px solid #ffc4d7;
  border-radius: 10px;
  outline-color: #fffb00;
}

textarea {
  height: 100px;
  resize: vertical;
}

.hidden {
  display: none !important;
}

/* KOTAK SURAT */
#suratGrid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  margin: 25px 0;
}

.surat {
  min-width: 0;
  background: white;
  padding: 15px 5px;
  border-radius: 14px;
  border: 2px solid #dce5ff;
  cursor: pointer;
  transition: 0.2s;
  overflow-wrap: anywhere;
  text-align: center;
}

.surat:hover {
  transform: translateY(-3px);
  border-color: #ffee02;
  background: #fff0f5;
}

.surat .emoji {
  font-size: 30px;
}

.surat p {
  font-size: 12px;
  font-weight: 700;
  margin: 8px 0 0;
}

#message {
  line-height: 1.8;
  white-space: pre-wrap;
}

/* KOMENTAR */
.comment-card {
  margin-top: 25px;
}

.comment-card h2 {
  margin-bottom: 5px;
}

.comment-info {
  font-size: 12px;
  color: #665e00;
  margin-bottom: 15px;
}

#commentList {
  margin-top: 20px;
  text-align: left;
}

.comment-item {
  background: white;
  padding: 14px;
  margin-top: 12px;
  border-radius: 12px;
  overflow-wrap: anywhere;
}

.comment-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
}

.comment-name {
  font-size: 14px;
  font-weight: 800;
  color: #272ae6;
}

.comment-date {
  font-size: 10px;
  color: #888;
  text-align: right;
}

.comment-text {
  margin: 8px 0 0;
  font-size: 14px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.empty-comment {
  font-size: 13px;
  color: #665e00;
  text-align: center;
  padding: 15px 0;
}

#feedback, #errorPassword, #result {
  color: #ffe600;
  font-size: 13px;
}

@media (max-width: 520px) {
  #suratGrid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  body {
    padding: 12px;
    background-attachment: scroll;
  }

  .card {
    padding: 20px;
  }
}
</style>
</head>

<body>
<div class="container">

  <section id="quiz" class="card">
    <h2>Hai, Kalian! 💙</h2>
    <p>Jawab pertanyaan ini dulu yaa.</p>
    <h3 id="question"></h3>
    <div id="options"></div>
    <p id="feedback"></p>
  </section>

  <section id="halamanSurat" class="hidden">
    <div class="card">
      <h2>Surat for my fren 💌</h2>
      <p>Cari nama lo, terus buka suratnya!</p>
    </div>

      <h2>Message for me 💬</h2>
      <p>Mau ngasih pesan buat gue ga?</p>
      <p class="comment-info">
        Tulis apa aja yang mau lo sampein di sini!
      </p>

      <input
        type="text"
        id="commentName"
        maxlength="40"
        placeholder="Nama (opsional)..."
      >

      <textarea
        id="reply"
        maxlength="1000"
        placeholder="Tulis pesan buat Paik..."
      ></textarea>

      <button class="next" onclick="sendMessage()">
        Kirim Komentar 💌
      </button>

      <p id="result"></p>

      <hr style="border:0; border-top:1px solid #d8c400; margin:25px 0;">

      <h3>Komentar Teman-Teman</h3>
      <div id="commentList"></div>
    </div>
  </section>

  <!-- HALAMAN PASSWORD -->
  <section id="halamanPassword" class="card hidden">
    <h2 id="judulPassword">🔒 Surat Rahasia</h2>
    <p>Masukkan password buat buka surat ini.</p>

    <input
      id="passwordInput"
      type="password"
      placeholder="Password surat..."
    >

    <button class="next" onclick="bukaSurat()">
      Buka Surat 💌
    </button>

    <button
      class="next"
      style="background:#777"
      onclick="kembali()"
    >
      Kembali
    </button>

    <p id="errorPassword"></p>
  </section>

  <section id="halamanIsi" class="card hidden">
    <h2 id="judulIsi"></h2>
    <p id="message"></p>

    <button class="next" onclick="tutupSurat()">
      Tutup Surat
    </button>
  </section>

</div>

choices.forEach((choice, index) => {

  button.textContent = choice;

  button.onclick = function() {
    if (index === correctAnswer) {
      document.getElementById("quiz").classList.add("hidden");
      document.getElementById("halamanSurat").classList.remove("hidden");
    } else {
      document.getElementById("feedback").textContent =
        "Yahh, salah 😝 Coba lagi!";
    }
  };

  options.appendChild(button);
});

let suratDipilih = null;
const grid = document.getElementById("suratGrid");

daftarSurat.forEach((surat, index) => {
  const kotak = document.createElement("div");
  kotak.className = "surat";

  const emoji = document.createElement("div");
  emoji.className = "emoji";
  emoji.textContent = "💌";

  const nama = document.createElement("p");
  nama.textContent = surat.nama;

  kotak.append(emoji, nama);

  kotak.onclick = function() {
    suratDipilih = index;

    document.getElementById("halamanSurat").classList.add("hidden");
    document.getElementById("halamanPassword").classList.remove("hidden");

    document.getElementById("judulPassword").textContent =
      "🔒 Surat untuk " + surat.nama;

    document.getElementById("passwordInput").value = "";
    document.getElementById("errorPassword").textContent = "";
  };

  grid.appendChild(kotak);
});

function bukaSurat() {
  const password = document.getElementById("passwordInput").value;
  const surat = daftarSurat[suratDipilih];

  if (surat && password === surat.password) {
    document.getElementById("halamanPassword").classList.add("hidden");
    document.getElementById("halamanIsi").classList.remove("hidden");

    document.getElementById("judulIsi").textContent =
      "💌 Buat lo nih, " + surat.nama;

    document.getElementById("message").textContent = surat.pesan;
  } else {
    document.getElementById("errorPassword").textContent =
      "Password salah! Coba lagi 😝";
  }
}

document.getElementById("passwordInput").addEventListener("keydown", function(e) {
  if (e.key === "Enter") bukaSurat();
});

function kembali() {
  document.getElementById("halamanPassword").classList.add("hidden");
  document.getElementById("halamanSurat").classList.remove("hidden");
}

function tutupSurat() {
  document.getElementById("halamanIsi").classList.add("hidden");
  document.getElementById("halamanSurat").classList.remove("hidden");
}

const COMMENT_KEY = "komentarPaikWebsite_v2";

localStorage.removeItem("komentarPaikWebsite");

let komentar = [];

try {
  komentar = JSON.parse(localStorage.getItem(COMMENT_KEY)) || [];
} catch (error) {
  komentar = [];
}

function tampilkanKomentar() {
  const commentList = document.getElementById("commentList");
  commentList.replaceChildren();

  if (komentar.length === 0) {
    const kosong = document.createElement("p");
    kosong.className = "empty-comment";
    kosong.textContent =
      "Belum ada komentar. Jadi yang pertama, yuk!";
    commentList.appendChild(kosong);
    return;
  }

  [...komentar].reverse().forEach((item) => {
    const kotak = document.createElement("div");
    kotak.className = "comment-item";

    const header = document.createElement("div");
    header.className = "comment-header";

    const nama = document.createElement("span");
    nama.className = "comment-name";
    nama.textContent = item.nama || "Anonim";

    const tanggal = document.createElement("span");
    tanggal.className = "comment-date";
    tanggal.textContent = item.tanggal;

    const isi = document.createElement("p");
    isi.className = "comment-text";
    isi.textContent = item.pesan;

    header.append(nama, tanggal);
    kotak.append(header, isi);
    commentList.appendChild(kotak);
  });
}

function sendMessage() {
  const namaInput = document.getElementById("commentName");
  const replyInput = document.getElementById("reply");
  const result = document.getElementById("result");

  // Nama boleh dikosongkan.
  const nama = namaInput.value.trim() || "Anonim";
  const pesan = replyInput.value.trim();

  if (pesan === "") {
    result.textContent = "Tulis pesannya dulu dongg 🥹";
    return;
  }

  const komentarBaru = {
    nama: nama,
    pesan: pesan,
    tanggal: new Date().toLocaleString("id-ID", {
      dateStyle: "short",
      timeStyle: "short"
    })
  };

  komentar.push(komentarBaru);

  try {
    localStorage.setItem(COMMENT_KEY, JSON.stringify(komentar));
  } catch (error) {
    console.warn("Komentar tidak dapat disimpan di browser.");
  }

  tampilkanKomentar();
  replyInput.value = "";
  namaInput.value = "";
  result.textContent = "Komentar berhasil ditambahkan!";
}

tampilkanKomentar();
</script>

</html>
